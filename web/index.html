<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Diganti nilai `--base-href` saat `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Jargon GO — Dinas Pendidikan Provinsi Sumatera Utara</title>
  <meta name="description"
        content="Layanan digital Dinas Pendidikan Provinsi Sumatera Utara: absensi siswa, pemantauan kehadiran untuk orang tua, pengaduan sekolah, dan pemberkasan guru.">
  <meta name="application-name" content="Jargon GO">
  <meta name="author" content="Dinas Pendidikan Provinsi Sumatera Utara">

  <!--
    Halaman ini memuat data siswa. Mesin pencari diminta TIDAK mengindeksnya.
    Meta tag di bawah tetap ada karena dipakai pratinjau tautan WhatsApp dan
    media sosial, yang membaca Open Graph tanpa peduli pada noindex.
  -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph: dibaca WhatsApp, Telegram, Facebook, LinkedIn. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jargon GO">
  <meta property="og:locale" content="id_ID">
  <meta property="og:title" content="Jargon GO — Dinas Pendidikan Provinsi Sumatera Utara">
  <meta property="og:description"
        content="Absensi siswa, pemantauan kehadiran untuk orang tua, pengaduan sekolah, dan pemberkasan guru dalam satu aplikasi.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Logo Jargon GO">

  <!-- Twitter/X memakai kartunya sendiri dan mengabaikan sebagian og:*. -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jargon GO — Dinas Pendidikan Provinsi Sumatera Utara">
  <meta name="twitter:description"
        content="Absensi siswa, pemantauan kehadiran untuk orang tua, pengaduan sekolah, dan pemberkasan guru dalam satu aplikasi.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!--
    Dua nilai, dipilih browser sesuai tema perangkat. Warnanya mengikuti
    ClayTheme: #131A2E (gelap) dan #EFF1FA (terang).
  -->
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131A2E">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFF1FA">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jargon GO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Latar dipasang sebelum Flutter memuat. Tanpa ini layar berkedip putih
      selama beberapa ratus milidetik sebelum kanvas tergambar — mencolok
      pada tema gelap.
    */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #131A2E;
    }

    @media (prefers-color-scheme: light) {
      html, body { background-color: #EFF1FA; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
